# CURATED annotations overlay — never silently treat as DERIVED filesystem fact.
# Applied during registry generation when skill_id matches.

skills:
  grill-me:
    capabilities: [adversarial-review, judge-grill]
    domains: [startup, review, pitch]
    task_types: [review, validate]
    triggers: [grill, adversarial, fatal assumption, stress test this idea]
    negative_triggers: [solidity audit, deploy kubernetes]
    trust_tier: T1
    when_to_use:
      - Adversarial review of plans and startup assumptions
    when_not_to_use:
      - Pure Solidity security audits (use solidity-audit specialist)

  solidity-security:
    capabilities: [solidity-audit, security-audit]
    domains: [solidity, security, web3]
    task_types: [audit, security-review]
    triggers: [solidity, escrow, smart contract audit, reentrancy]
    negative_triggers: [pitch, branding, marketing, hackathon pitch]
    trust_tier: T2
    mutable_fact_policy: null

  web3-testing:
