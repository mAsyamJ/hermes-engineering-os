experiment_id: real-model-sol-vs-terra-v2
version: "2"
scope: BENCHMARK
design: PAIRED
treatment_dimension: MODEL
hypothesis: "A paired non-fixture engineering benchmark will recover a model-only treatment difference between already-configured openai-codex models, if one exists, under ITT and a fixed confirmatory horizon frozen before any model output."
expected_direction: UNKNOWN
experimental_unit: benchmark_case_execution
benchmark_suite: real-v1
control:
  variant_id: model-sol
  variant_name: gpt-5.6-sol
  model: gpt-5.6-sol
candidate:
  variant_id: model-terra
  variant_name: gpt-5.6-terra
  model: gpt-5.6-terra
assignment:
  algorithm: assign-hmac-sha256-v1
  seed: real-model-sol-vs-terra-v2-seed
  blocked_by: suite
primary_metric:
